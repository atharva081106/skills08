<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 220" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <style>
    .card-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #f0f6fc; }
    .card-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11.5px; fill: #8b949e; line-height: 1.4; }
    .card-tag { font-family: "JetBrains Mono", Consolas, monospace; font-size: 10px; font-weight: 600; }
  </style>

  <!-- Background -->
  <rect width="960" height="220" rx="14" fill="#090d13" stroke="#21262d" stroke-width="1"/>

  <!-- Card 1: Pure Stdlib -->
  <g transform="translate(18, 18)">
    <rect width="216" height="184" rx="10" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.2"/>
    <rect x="14" y="14" width="36" height="36" rx="8" fill="url(#blueGlow)" opacity="0.9"/>
    <text x="32" y="38" font-size="18px" text-anchor="middle" fill="#fff">⚡</text>
    <text x="14" y="74" class="card-title">Pure Stdlib Core</text>
    <text x="14" y="94" class="card-subtitle">Zero external package dependencies required. Runs instantly out of the box on Python 3.</text>
    <rect x="14" y="148" width="124" height="22" rx="4" fill="#1f2937"/>
    <text x="20" y="163" class="card-tag" fill="#38bdf8">0 DEPENDENCIES</text>
  </g>

  <!-- Card 2: Universal Multi-Agent -->
  <g transform="translate(252, 18)">
    <rect width="216" height="184" rx="10" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.2"/>
    <rect x="14" y="14" width="36" height="36" rx="8" fill="url(#purpleGlow)" opacity="0.9"/>
    <text x="32" y="38" font-size="18px" text-anchor="middle" fill="#fff">🌐</text>
    <text x="14" y="74" class="card-title">Multi-Agent Bridge</text>
    <text x="14" y="94" class="card-subtitle">Installs once, projects across Google Antigravity, Cursor, Claude Code, Copilot, &amp; Windsurf.</text>
    <rect x="14" y="148" width="138" height="22" rx="4" fill="#2e1065"/>
    <text x="20" y="163" class="card-tag" fill="#c084fc">7 CODING AGENTS</text>
  </g>

  <!-- Card 3: Model A Security -->
  <g transform="translate(486, 18)">
    <rect width="216" height="184" rx="10" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.2"/>
    <rect x="14" y="14" width="36" height="36" rx="8" fill="url(#greenGlow)" opacity="0.9"/>
    <text x="32" y="38" font-size="18px" text-anchor="middle" fill="#fff">🛡️</text>
    <text x="14" y="74" class="card-title">Model A Safety</text>
    <text x="14" y="94" class="card-subtitle">Omit dangerous upstream scripts, network egress, &amp; background daemons for host safety.</text>
    <rect x="14" y="148" width="132" height="22" rx="4" fill="#064e3b"/>
    <text x="20" y="163" class="card-tag" fill="#4ade80">STRICT CURATION</text>
  </g>

  <!-- Card 4: Integrity Verifier -->
  <g transform="translate(720, 18)">
    <rect width="216" height="184" rx="10" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.2"/>
    <rect x="14" y="14" width="36" height="36" rx="8" fill="url(#amberGlow)" opacity="0.9"/>
    <text x="32" y="38" font-size="18px" text-anchor="middle" fill="#fff">🔒</text>
    <text x="14" y="74" class="card-title">Digest Verification</text>
    <text x="14" y="94" class="card-subtitle">Full SHA-256 package audit trail with automatic detection of modified, missing or extra files.</text>
    <rect x="14" y="148" width="126" height="22" rx="4" fill="#451a03"/>
    <text x="20" y="163" class="card-tag" fill="#fbbf24">SHA-256 LOCKED</text>
  </g>
</svg>
